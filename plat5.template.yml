name: bun-effect-api
description: Bun + Effect reference API (profiles, projects, tasks)

upstreams:
  api: "3000"

routes:
  - ./routes.identity.yml
  - ./routes.audit.yml
  - ./routes.yml

substitute:
  - package.json

# plat5 start runs the API and the starter web app from this compose file. The web
# app's origin is allowed to sign in with local Auth.
app:
  compose: docker-compose.yml
  web: http://localhost:3001

# To run the API on your own machine instead: plat5 start -x app, then
next:
  - bun install
  - bun run dev
