name: bun-effect-api
kind: api
description: Bun + Effect reference API (profiles, projects, tasks)

upstreams:
  api: "3000"

routes:
  - ./routes.identity.yml
  - ./routes.audit.yml
  - ./routes.yml

# What staff may call on this API. plat5 init adds it to operator.routes.yml.
operator_routes: ./routes.operator.yml

substitute:
  - package.json

# plat5 init copies this starter into a project's api/ folder, and moves the
# route files and roles.yml up to the project root: they are the project's.
# plat5 start runs the API from this compose file.
app:
  compose: docker-compose.yml

# To run the API on your own machine instead: plat5 start -x app, then
next:
  - bun install
  - bun run dev
